name: CI

on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install -r app/requirements.txt
          cd app && pytest

      - name: Set Docker Hub image name
        run: echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/devops-demo" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Update image tag in manifest (GitOps)
        run: |
          sed -i "s|image: .*|image: ${IMAGE}:${GITHUB_SHA}|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "ci: deploy ${GITHUB_SHA::7} [skip ci]"
          git push
